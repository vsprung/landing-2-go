<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- ALU3 mark: a graphite square with three aluminium pickets (the "3" in ALU3)
       under an accent top rail. Keep in sync with favicon.ico and apple-touch-icon.png,
       which are rendered from the same rectangles. -->
  <rect width="32" height="32" fill="#1c2024"/>
  <rect x="6" y="6" width="20" height="3" fill="#8fa3e0"/>
  <rect x="7" y="9" width="4" height="17" fill="#eef0f1"/>
  <rect x="14" y="9" width="4" height="17" fill="#eef0f1"/>
  <rect x="21" y="9" width="4" height="17" fill="#eef0f1"/>
  <rect x="6" y="22" width="20" height="2" fill="#eef0f1"/>
</svg>
